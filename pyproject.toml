[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "AI-powered travel planning agent with LangGraph, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-tavily>=0.1.0",
    "langchain-google-community[places]>=2.0.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "config*", "exception*", "logger*", "prompt_library*", "tools*", "utils*"]
